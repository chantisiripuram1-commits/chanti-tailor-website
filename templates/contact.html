<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Chanti Tailor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include 'navbar.html' %}

<section class="page-header">

    <h1>
        Contact Us
    </h1>

    <p>
        We would love to hear from you.
    </p>

</section>


<section class="section">

    <div class="about-content">


        <div class="about-box">

            <h2>
                Get In Touch
            </h2>

            <br>

            <p>
                📞 Phone: +91 8830349422
            </p>

            <p>
                📧 Email: chantisiripuram3@gmail.com
            </p>

            <p>
                📍 Location: Mumbai, Maharashtra, India
            </p>

            <p>
                🕒 Opening Hours:
                24Hours.
            </p>

        </div>


        <div class="auth-card">

            <h2>
                Send Message
            </h2>

            <br>


            <form>

                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Message
                    </label>

                    <textarea
                        rows="5"
                        placeholder="Write your message..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="full-button">

                    Send Message

                </button>

            </form>

        </div>

    </div>

</section>


<footer>

    <h3>
        🧵 Chanti Tailor
    </h3>

    <p>
        Perfect Fit. Perfect Style.
    </p>

</footer>


</body>
</html>
