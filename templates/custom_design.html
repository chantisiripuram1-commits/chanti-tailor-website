<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Custom Design | Chanti Tailor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include 'navbar.html' %}

<center>
<section class="section">

    <div class="auth-card">

        <h2>
            Design Request
        </h2>

        <p>
            Share your requirements with Chanti Tailor.
        </p>


        <form>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Clothing Type
                </label>

                <select>

                    <option>
                        Shirt
                    </option>

                    <option>
                        Pant
                    </option>

                    <option>
                        Kurta
                    </option>

                    <option>
                        Blazer
                    </option>

                    <option>
                        Suit
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Describe Your Design
                </label>

                <textarea
                    rows="6"
                    placeholder="Describe your design..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Upload Design
                </label>

                <input type="file">

            </div>


            <button
                type="submit"
                class="full-button">

                Submit Design Request

            </button>


        </form>

    </div>

</section>
</center>

<footer>

    <h3>
        🧵 Chanti Tailor
    </h3>

    <p>
        Perfect Fit. Perfect Style.
    </p>

</footer>


</body>
</html>
