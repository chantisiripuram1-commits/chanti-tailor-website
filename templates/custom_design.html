<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Custom Design | Chanti Tailor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🧵 Chanti Tailor
    </div>

    <nav>

        <a href="{{ url_for('home') }}">Home</a>

        <a href="{{ url_for('about') }}">About</a>

        <a href="{{ url_for('services') }}">Services</a>

        <a href="{{ url_for('catalogue') }}">Catalogue</a>

        <a href="{{ url_for('custom_design') }}">
            Custom Design
        </a>

        <a href="{{ url_for('place_order') }}">
            Place Order
        </a>

        <a href="{{ url_for('my_orders') }}">
            My Orders
        </a>

        <a href="{{ url_for('contact') }}">
            Contact
        </a>

        <a href="{{ url_for('login') }}">Login</a>

        <a href="{{ url_for('signup') }}"
           class="nav-button">
            Signup
        </a>

    </nav>

</header>


<section class="page-header">

    <h1>
        Custom Design
    </h1>

    <p>
        Have your own design?
        Tell us what you want.
    </p>

</section>


<section class="section">

    <div class="auth-card">

        <h2>
            Design Request
        </h2>

        <p>
            Share your requirements with Chanti Tailor.
        </p>


        <form>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Clothing Type
                </label>

                <select>

                    <option>
                        Shirt
                    </option>

                    <option>
                        Pant
                    </option>

                    <option>
                        Kurta
                    </option>

                    <option>
                        Blazer
                    </option>

                    <option>
                        Suit
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Describe Your Design
                </label>

                <textarea
                    rows="6"
                    placeholder="Describe your design..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Upload Design
                </label>

                <input type="file">

            </div>


            <button
                type="submit"
                class="full-button">

                Submit Design Request

            </button>


        </form>

    </div>

</section>


<footer>

    <h3>
        🧵 Chanti Tailor
    </h3>

    <p>
        Perfect Fit. Perfect Style.
    </p>

</footer>


</body>
</html>
