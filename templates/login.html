<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Chanti Tailor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

{% include 'navbar.html' %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🧵
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your Chanti Tailor account.
        </p>


        <form
            method="POST"
            action="{{ url_for('login') }}">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="full-button">

                Login

            </button>


        </form>


        <p class="bottom-text">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Sign Up
            </a>

        </p>

    </div>

</div>


</body>
</html>
