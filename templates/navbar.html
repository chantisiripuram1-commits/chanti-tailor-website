<header class="navbar">

    <div class="logo">
        🧵 Chanti Tailor
    </div>

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('about') }}">
            About
        </a>

        <a href="{{ url_for('services') }}">
            Services
        </a>

        <a href="{{ url_for('catalogue') }}">
            Catalogue
        </a>

        <a href="{{ url_for('custom_design') }}">
            Custom Design
        </a>

        <a href="{{ url_for('place_order') }}">
            Place Order
        </a>

        <a href="{{ url_for('my_orders') }}">
            My Orders
        </a>

        <a href="{{ url_for('contact') }}">
            Contact
        </a>


        {% if session.get('user') %}

            <span class="user-name">
                👤 {{ session.get('user') }}
            </span>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a href="{{ url_for('signup') }}"
               class="nav-button">
                Signup
            </a>

        {% endif %}

    </nav>

</header>
